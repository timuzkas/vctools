{{ define "main" }}
  <h1>{{ .Title }}</h1>
  <div class="horiz index"> 
    <p class="desc">{{ .Params.description }}</p>
    <p class="search"> Start typing to search... </p>
  </div>
  {{ .Content }}

  <hr class="divider"></hr>

  <div class="tool-grid">
    {{ range (site.GetPage "/tools").Pages.ByWeight}}
      <a class="tool-card" href="{{ .RelPermalink }}">
        <h3>{{ .Title }}</h3>
        <p>{{ .Params.description }}</p>
      </a>
    {{ end }}
  </div>
  <script src="{{ "js/search.js" | relURL }}" defer></script>
{{ end }}
