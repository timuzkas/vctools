<aside class="sidebar">
  <h3> verycooltools </h3>

  <span></span>
  
  <div>
    <a href="{{ "/" | relURL }}" {{ if .IsHome }}aria-current="page"{{ end }}>Home</a>
    {{ $page := . }}
    {{ range (site.GetPage "/tools").Pages.ByWeight }}
      <a href="{{ .RelPermalink }}" {{ if eq .RelPermalink $page.RelPermalink }}aria-current="page"{{ end }}>{{ .Title }}</a>
    {{ end }}
    <a class="suggest" href="https://github.com/timuzkas/vctools/issues/new?title=Suggestion:%20&labels=suggestion&body=What%20would%20you%20like%20to%20see%3F%0A%0A">
      Suggest a tool
    </a>
  </div>

  <p>all of the tools require javascript, note that. however we do not collect any information, this site is purely client side too. </p>
</aside>
