{{ define "head" }}
  {{ with .Resources.Get "tool.css" }}<link rel="stylesheet" href="{{ .RelPermalink }}">{{ end }}
{{ end }}

{{ define "main" }}
  <header>
    <h1>{{ .Title }}</h1>
    <p>{{ .Params.description }}</p>
  </header>
  <hr>
  <section data-tool="{{ .File.ContentBaseName }}">
    {{ .Content }}
  </section>
  {{ with .Resources.Get "tool.js" }}
    <script type="module" src="{{ .RelPermalink }}"></script>
  {{ end }}
{{ end }}
